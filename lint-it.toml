[workspace]
kind = "library"
layout = "lint-it"

[conventions]
extend_allowed_bases = ["ast.NodeTransformer", "ast.NodeVisitor"]

[layouts.lint-it]
extends = "flat"
layers = [
  { glob = "src/*/config_values.py", layer = "core" },
  { glob = "src/*/engine.py", layer = "core" },
  { glob = "src/*/globs.py", layer = "core" },
  { glob = "src/*/imports.py", layer = "core" },
  { glob = "src/*/layouts.py", layer = "core" },
  { glob = "src/*/reporting.py", layer = "core" },
  { glob = "src/*/symbols.py", layer = "core" },
  { glob = "src/*/workspace.py", layer = "core" },
  { glob = "src/*/rules/**/*.py", layer = "core" },
]
