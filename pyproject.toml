[project]
name = "lint-it"
version = "0.14.0"
description = "Strict architecture linting for Python functional cores and imperative shells"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Denis Maciel" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["lint", "architecture", "static-analysis", "functional-core"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/denismaciel/lint-it"
Issues = "https://github.com/denismaciel/lint-it/issues"
Changelog = "https://github.com/denismaciel/lint-it/blob/main/CHANGELOG.md"

[project.scripts]
lint-it = "lint_it.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "docs/**", "lint-it.toml", "CHANGELOG.md", "uv.lock"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<1", "ty>=0.0.70"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["lint_it"]
