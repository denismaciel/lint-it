name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.4"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ty check src
      - run: uv run pytest
      - run: uv run lint-it --workspace .
      - run: uv build
      - name: Smoke test the built wheel
        run: |
          uv run --isolated --no-project --with dist/lint_it-*.whl lint-it --workspace .
          uv run --isolated --no-project --with dist/lint_it-*.whl lint-it-packages --help
          uv run --isolated --no-project --with dist/lint_it-*.whl lint-it-advisory --help
